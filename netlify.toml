[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# El CRM es una sola página: todas las rutas cargan index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Seguridad para todo el CRM.
# Content-Security-Policy: el navegador solo acepta código propio, estilos y fuentes
# de Google Fonts y conexiones a Supabase. Si sumás otro servicio, agregá su dominio acá.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://mryuhzpenzpyhfidwsup.supabase.co wss://mryuhzpenzpyhfidwsup.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Los archivos con hash en el nombre no cambian nunca: el navegador los guarda un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
