<!--
  Plantilla del email de invitación al equipo.
  Dónde va: Supabase → Authentication → Emails → Templates → "Invite user".
  Asunto sugerido: Te sumaron al equipo de AVA
-->
<div style="background:#16171B;padding:32px 16px;font-family:Manrope,Arial,sans-serif;color:#F4F5F3;">
  <div style="max-width:480px;margin:0 auto;background:#1D1E23;border:1px solid #2E3038;border-radius:10px;padding:28px;">
    <p style="margin:0 0 20px;font-size:20px;font-weight:800;letter-spacing:0.02em;">AVA</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Hola:</p>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
      Te sumaron al equipo de AVA. Para entrar al CRM, creá tu contraseña con este botón:
    </p>
    <p style="margin:0 0 24px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#12E086;color:#06341F;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:999px;">Crear mi contraseña</a>
    </p>
    <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#9A9CA6;">
      El link sirve una sola vez y vence. Si venció, pedile a quien te invitó que te lo reenvíe.
    </p>
    <p style="margin:0;font-size:14px;line-height:1.6;color:#9A9CA6;">
      Si no esperabas este email, ignoralo: nadie puede entrar con tu dirección sin este link.
    </p>
  </div>
</div>
